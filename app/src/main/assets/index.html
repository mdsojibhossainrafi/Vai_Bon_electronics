const L={};TR.split('\n').forEach(l=>{const [k,e,b]=l.split('|');L[k]={en:e,bn:b}});
let lang='bn';
const t=(k,...a)=>{let s=(L[k]||{})[lang]||k;a.forEach((v,i)=>s=s.replace('{'+i+'}',v));return s};
const nm=x=>String(x).startsWith('k:')?t(x.slice(2)):x;

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const N=(n,d=3)=>(+n).toLocaleString(loc(),{maximumFractionDigits:d}),M=n=>'৳'+N(n,2);
const dt=ts=>new Date(ts).toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'});
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const DEF=()=>({products:[],memos:[],purchases:[],parties:[],audit:[],
 cats:['wire','bulb','switch','fan','acc','tools','oth'].map(k=>({id:'c_'+k,name:'k:'+k})),
 units:['piece','gaj','meter','foot','roll','packet','set','kg'].map(k=>({id:'u_'+k,name:'k:'+k})),
 settings:{shop:'',addr:'',phone:'',lang:'bn',pinHash:null,lock:5,low:5,memoSeq:0,schema:2}});
const hash=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vb:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return 'p:'+s}};
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('vaibon',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const getK=k=>new Promise((ok,no)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){const d=DEF();for(const k of KEYS){const v=await getK(k);D[k]=v===undefined?d[k]:v}D.settings={...d.settings,...D.settings}
 // migration: make sure legacy records have the expected fields
 D.products.forEach(p=>{p.stock=r3(p.stock||0);p.cost=+p.cost||0;p.price=+p.price||0});D.memos.forEach(m=>{m.status=m.status||'active'})}
function save(keys){return new Promise((ok,no)=>{const tx=db.transaction('kv','readwrite');keys.forEach(k=>tx.objectStore('kv').put(D[k],k));tx.oncomplete=ok;tx.onerror=tx.onabort=()=>no(tx.error||new Error('tx'))})}
let busy=false;
async function commit(fn,keys){if(busy)return false;busy=true;try{fn();await save(keys);return true}catch(e){try{await load()}catch{}toast(t('eSave',e.message||e.name),1);return false}finally{busy=false}}

function confirmBox(msg,act,id){mo(`<p>${esc(msg)}</p><div class="row"><button class="b r" data-a="${act}" data-id="${id}">${t('del')}</button><button class="b o" data-a="close">${t('cancel')}</button></div>`)}
function pinBox(){mo(`<h3>🔒 ${t('showW')}</h3><label>${t('pin')}</label><input id="pinv" type="password" inputmode="numeric" autocomplete="off"><div class="row" style="margin-top:10px"><button class="b" data-a="pincheck">${t('unlock')}</button><button class="b o" data-a="close">${t('cancel')}</button></div>`)}

async function mcreate(){const items=S.cart;if(!items.length)return toast(t('eEmpty'),1);
 for(const i of items){const p=prod(i.pid);if(!p||isNaN(i.qty)||i.qty<=0)return toast(t('eQty'),1);if(i.qty>p.stock)return toast(t('eStock',p.name),1);if(isNaN(i.price)||i.price<0)return toast(t('ePrice'),1)}
 const sub=r2(items.reduce((s,i)=>s+i.qty*i.price,0)),d=S.f.disc===''?0:num(S.f.disc),pd=S.f.paid===''?0:num(S.f.paid);
 if(isNaN(d)||d<0||d>sub)return toast(t('eDisc'),1);if(isNaN(pd)||pd<0)return toast(t('ePay'),1);
 const total=r2(sub-d);let m;
 const ok=await commit(()=>{D.settings.memoSeq++;m={id:uid(),no:'VB-'+String(D.settings.memoSeq).padStart(5,'0'),ts:Date.now(),cust:S.f.cust.trim(),phone:S.f.phone.trim(),method:S.f.method,note:S.f.note.trim(),sub,disc:r2(d),total,paid:r2(pd),due:r2(Math.max(0,total-pd)),status:'active',
  items:items.map(i=>{const p=prod(i.pid);p.stock=r3(p.stock-i.qty);return{pid:p.id,name:p.name,unit:unitN(p.unit),cat:p.cat,qty:i.qty,price:i.price,cost:p.cost}})};D.memos.push(m);
  const c=m.cust&&D.parties.find(x=>x.type==='c'&&x.name===m.cust);if(m.cust&&!c){D.parties.push({id:uid(),type:'c',name:m.cust,phone:m.phone})}},['memos','products','settings','parties']);
 if(ok){S.cart=[];S.f={cust:'',phone:'',disc:'',paid:'',method:'cash',note:''};render();refresh();mo(memoView(m))}}
async function mdel(id){const m=D.memos.find(x=>x.id===id);if(!m||m.status!=='active')return closeM();
 if(await commit(()=>{m.items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=r3(p.stock+i.qty)});m.status='deleted';m.delTs=Date.now();D.audit.push({ts:Date.now(),ev:'memo-delete+restock',ref:m.no})},['memos','products','audit'])){closeM();toast(t('saved'));render()}}
async function share(id){const m=D.memos.find(x=>x.id===id),tx=memoText(m);
 if(navigator.share){try{await navigator.share({title:m.no,text:tx});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(tx);toast(t('copied'))}catch{mo(`<p>${t('copyMan')}</p><textarea rows="12" readonly onfocus="this.select()">${esc(tx)}</textarea><button class="b o" data-a="close" style="margin-top:8px">${t('close')}</button>`)}}
function exportB(){const o={app:'vaibon',schema:2,exported:new Date().toISOString(),lang,data:Object.fromEntries(KEYS.map(k=>[k,D[k]]))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='vaibon-backup-'+ymd(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function validB(o){try{if(!o||o.app!=='vaibon'||!o.schema||o.schema>2||!o.data)return false;const d=o.data;for(const k of ['products','memos','purchases','parties','cats','units','audit'])if(!Array.isArray(d[k]))return false;if(typeof d.settings!=='object'||!d.settings)return false;
 if(!d.products.every(p=>p&&p.id&&typeof p.name==='string'&&isFinite(p.stock)&&p.stock>=0&&isFinite(p.price)&&isFinite(p.cost)))return false;
 return d.memos.every(m=>m&&m.id&&Array.isArray(m.items)&&isFinite(m.total))&&d.purchases.every(p=>p&&p.id&&isFinite(p.total))}catch{return false}}
const dayAdd=(f)=>f;

 go(e){S.page=e.dataset.id;render();refresh();window.scrollTo(0,0)},lang(){lang=lang==='bn'?'en':'bn';D.settings.lang=lang;save(['settings']).catch(()=>{});render();refresh()},
 unlock(){pinBox()},lock(){S.un=false;render();refresh()},close:closeM,print(){window.print()},

 addcart(e){const p=prod(e.dataset.id),l=S.cart.find(i=>i.pid===p.id);if(l)l.qty=r3(l.qty+1);else S.cart.push({pid:p.id,qty:1,price:p.price});$('#cart').innerHTML=cartHtml();$('#tot').innerHTML=totHtml()},

 mview(e){mo(memoView(D.memos.find(m=>m.id===e.dataset.id)))},mdel(e){const m=D.memos.find(x=>x.id===e.dataset.id);confirmBox(t('delMemoQ',m.no),'mdel2',m.id)},mdel2(e){mdel(e.dataset.id)},share(e){share(e.dataset.id)},
 async bsave(){const p=prod(v('b_p')),q=num(v('b_q')),c=num(v('b_c')),ex=num(v('b_e')||0),pd=num(v('b_pd')||0);if(!p)return toast(t('eEmpty'),1);if(isNaN(q)||q<=0)return toast(t('eQty'),1);if(isNaN(c)||c<0||isNaN(ex)||ex<0)return toast(t('ePrice'),1);const total=r2(q*c+ex);if(isNaN(pd)||pd<0||pd>total)return toast(t('ePay'),1);
  if(await commit(()=>{p.stock=r3(p.stock+q);p.cost=r2(total/q);D.purchases.push({id:uid(),ts:Date.now(),pid:p.id,pname:p.name,sup:v('b_s'),qty:q,unit:unitN(p.unit),ucost:c,extra:ex,total,paid:pd,due:r2(total-pd),inv:v('b_i'),note:v('b_n')});const s=v('b_s');if(s&&!D.parties.some(x=>x.type==='s'&&x.name===s))D.parties.push({id:uid(),type:'s',name:s})},['products','purchases','parties'])){toast(t('saved'));render()}},
 partyform(e){partyform(e.dataset.id,e.dataset.t)},

 async pdel(e){if(await commit(()=>{D.parties=D.parties.filter(x=>x.id!==e.dataset.id)},['parties']))render()},
 rep(e){S.from=S.to='';S.lastRep=e.dataset.id;render()},
 async ssave(){const pin=v('s_pin');if(pin&&(pin.length<4||!/^\d+$/.test(pin)))return toast(t('pin'),1);const h=pin?await hash(pin):null;
  if(await commit(()=>{const s=D.settings;s.shop=v('s_n');s.addr=v('s_a');s.phone=v('s_p');s.low=Math.max(0,num(v('s_l'))||0);s.lock=Math.max(1,Math.round(num(v('s_k'))||5));if(h)s.pinHash=h},['settings'])){toast(t('saved'));render()}},
 async addcat(){const n=v('n_c');if(n&&await commit(()=>D.cats.push({id:uid(),name:n}),['cats']))render()},
